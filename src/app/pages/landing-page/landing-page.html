<div class="page-wrapper">
  <div class="app-card">
    <div class="app-card-icon">♥</div>
    <h1>{{ landingPage.Title }}</h1>
    <p class="subtitle">{{ landingPage.Description }}</p>
    <p class="prompt" *ngIf="landingPage.Prompt">{{ landingPage.Prompt }}</p>
    <button class="app-button" (click)="onGetStarted()">{{ landingPage.ButtonText }}</button>
  </div>
</div>
